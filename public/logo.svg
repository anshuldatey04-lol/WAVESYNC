<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1326" />
      <stop offset="100%" stop-color="#05060b" />
    </linearGradient>
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>
    <!-- Wave Gradient -->
    <linearGradient id="logoWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="textWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="120" height="120" rx="30" fill="url(#logoBgGrad)" stroke="url(#logoBorder)" stroke-width="2.5" />
    
    <!-- Sound Waves (Left & Right) -->
    <path d="M 28 42 A 28 28 0 0 0 28 78" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
    <path d="M 92 42 A 28 28 0 0 1 92 78" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />

    <!-- Wave Equalizer Bars -->
    <rect x="36" y="52" width="4.5" height="16" rx="2.25" fill="#00f5ff" />
    <rect x="44" y="42" width="4.5" height="36" rx="2.25" fill="#38bdf8" />
    <rect x="52" y="32" width="4.5" height="56" rx="2.25" fill="#60a5fa" />
    <rect x="60" y="24" width="5.5" height="72" rx="2.75" fill="#ffffff" filter="url(#logoGlow)" />
    <rect x="68" y="32" width="4.5" height="56" rx="2.25" fill="#818cf8" />
    <rect x="76" y="42" width="4.5" height="36" rx="2.25" fill="#a855f7" />
    <rect x="84" y="52" width="4.5" height="16" rx="2.25" fill="#c084fc" />

    <!-- Sine Wave Line -->
    <path d="M 26 60 Q 43 40 60 60 T 94 60" fill="none" stroke="url(#logoWaveGrad)" stroke-width="3" stroke-linecap="round" filter="url(#logoGlow)" />
    <path d="M 26 60 Q 43 40 60 60 T 94 60" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
    <circle cx="60" cy="60" r="3.5" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <g transform="translate(150, 75)">
    <!-- SYNC -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" fill="#ffffff">
      SYNC
    </text>
    <!-- WAVE -->
    <text x="145" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" fill="url(#textWaveGrad)">
      WAVE
    </text>
    <!-- Subtitle Badge -->
    <rect x="0" y="16" width="280" height="24" rx="12" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1" />
    <circle cx="12" cy="28" r="3" fill="#38bdf8" />
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#93c5fd">
      MULTI-DEVICE AUDIO SYNC
    </text>
  </g>
</svg>
