<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1326" />
      <stop offset="50%" stop-color="#090b14" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="75%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="barGradCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="cyanGlow" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="75%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle with glowing border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />
  
  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="160" cy="180" r="160" fill="url(#cyanGlow)" />
  <circle cx="350" cy="330" r="160" fill="url(#purpleGlow)" />

  <!-- Outer Broadcast / Sync Waves (Left side) -->
  <path d="M 124 168 A 120 120 0 0 0 124 344" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.35" />
  <path d="M 92 136 A 168 168 0 0 0 92 376" fill="none" stroke="#00f5ff" stroke-width="6" stroke-linecap="round" opacity="0.2" />

  <!-- Outer Broadcast / Sync Waves (Right side) -->
  <path d="M 388 168 A 120 120 0 0 1 388 344" fill="none" stroke="#a855f7" stroke-width="7" stroke-linecap="round" opacity="0.35" />
  <path d="M 420 136 A 168 168 0 0 1 420 376" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" opacity="0.2" />

  <!-- Central Audio Waveform Equalizer Bars -->
  <!-- Bar 1 -->
  <rect x="146" y="216" width="14" height="80" rx="7" fill="#00f5ff" opacity="0.8" filter="url(#neonGlow)" />
  <!-- Bar 2 -->
  <rect x="176" y="184" width="14" height="144" rx="7" fill="#38bdf8" opacity="0.9" filter="url(#neonGlow)" />
  <!-- Bar 3 -->
  <rect x="206" y="152" width="14" height="208" rx="7" fill="#60a5fa" filter="url(#neonGlow)" />
  <!-- Bar 4 (Center Harmonic Peak) -->
  <rect x="236" y="116" width="16" height="280" rx="8" fill="url(#barGradCenter)" filter="url(#softGlow)" />
  <rect x="236" y="116" width="16" height="280" rx="8" fill="#ffffff" />
  <!-- Bar 5 -->
  <rect x="268" y="144" width="14" height="224" rx="7" fill="#818cf8" filter="url(#neonGlow)" />
  <!-- Bar 6 -->
  <rect x="298" y="176" width="14" height="160" rx="7" fill="#a855f7" opacity="0.9" filter="url(#neonGlow)" />
  <!-- Bar 7 -->
  <rect x="328" y="208" width="14" height="96" rx="7" fill="#c084fc" opacity="0.8" filter="url(#neonGlow)" />
  <!-- Bar 8 -->
  <rect x="358" y="232" width="14" height="48" rx="7" fill="#ec4899" opacity="0.75" filter="url(#neonGlow)" />

  <!-- Flowing Synchronized Sine Wave Overlay -->
  <path d="M 110 256 Q 160 170 210 256 T 310 256 T 410 256" fill="none" stroke="url(#waveGrad)" stroke-width="7" stroke-linecap="round" filter="url(#softGlow)" opacity="0.9" />
  <path d="M 110 256 Q 160 170 210 256 T 310 256 T 410 256" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />

  <!-- Center Sync Pulse Ring & Core Node -->
  <circle cx="244" cy="256" r="14" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
  <circle cx="244" cy="256" r="6" fill="#ffffff" filter="url(#neonGlow)" />
</svg>
